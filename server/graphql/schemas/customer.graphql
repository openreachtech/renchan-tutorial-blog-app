scalar BigNumber
scalar DateTime
scalar Upload

################################################################################
#### QUERY
################################################################################

## !!!!!!!! Please add in dictionary order.
type PaginatedCustomers {
  data: [Customer!]!
  total: Int!
  page: Int!
  limit: Int!
  totalPages: Int!
}

input  CustomerPaginationInput {
  page: Int
  limit: Int
}

type Query {
  customer: Customer!
  customerById(id: Int!): Customer!
  customerPagination(customerPaginationInput : CustomerPaginationInput): PaginatedCustomers!
  payments: [Payment!]!

  # for furo boilerplate -------------------------------------------------------
  companySponsors: CompanySponsorsResult!
  curriculums(input: CurriculumsSearchInput!): CurriculumsResult!

  # for subscription -----------------------------------------------------------
  chatMessages (input: ChatMessagesInput!): ChatMessagesResult!
  chatRooms: ChatRoomsResult!

  # for scalar sample ----------------------------------------------------------
  customerAmounts: CustomerAmountsResult!
  articles(input: ArticlesInput!): ArticlesResult!
  article(input: ArticleInput!): Article!
}

type Article {
  articleId: Int!
  thumbnailUrl: String!
  title: String!
  content: String!
  postedAt: DateTime!
  tags: [Tag!]!
}

################################################################################
#### SUBSCRIPTION
################################################################################

type Subscription {
  onReceiveMessage (input: OnReceiveMessageInput!): OnReceiveMessageResult!
}

################################################################################
#### TYPE
################################################################################

## !!!!!!!! Please add in dictionary order.

type AuthResult {
  accessToken: String!
}

type Customer {
  id: Int!
  username: String!
  email: String!
  registeredAt: String!

  CustomerDetail: CustomerDetail
}

type CustomerDetail {
  email: String!
}

type Payment {
  amount: String!
  coinType: String!
  fixedAt: String!
}

# for furo boilerplate ---------------------------------------------------------
type CompanySponsorsResult {
  companySponsors:  [CompanySponsor!]!
}

type CompanySponsor {
  id: Int!
  registeredAt: DateTime!
  companyName: String!
  companyDescription: String!
  companySponsorHomepage: String
  companySponsorLogo: String
}

type CurriculumsResult {
  curriculums: [Curriculum!]!
type ArticlesResult {
  articles: [ListArticle!]!
  pagination: Pagination!
}

type ListArticle {
  articleId: Int!
  thumbnailUrl: String!
  title: String!
  postedAt: DateTime!
  tags: [Tag!]!
}

type Pagination {
  limit: Int!
  offset: Int!
  sort: Sort
  totalRecords: Int!
}

type Sort {
  targetColumn: String!
  orderBy: String!
}

type Tag {
  tagId: Int!
  name: String!
}

################################################################################
#### INPUT
################################################################################

input ArticleInput {
  articleId: Int!
}

input ArticlesInput {
  tagIds: [Int!]!
  pagination: PaginationInput!
}

input PaginationInput {
  limit: Int!
  offset: Int!
  sort: SortInput
}

input SortInput {
  targetColumn: String!
  orderBy: String!
}
